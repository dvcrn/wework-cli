[tools]
go = "1.26.0"

[tasks.fix]
description = "Auto-applies Golang fixes"
run = "go fix ./..."

[tasks.format]
description = "Run go fix, then format code with goimports"
depends = ["fix"]
run = 'find . -name "*.go" -type f -exec go tool goimports -w {} +'

[tasks.install]
description = "Install wework CLI tool locally"
run = "go install ./cmd/wework"

[tasks.sync_versions]
description = "Sync plugin/package versions from npm/package.json"
run = "node scripts/sync_versions.mjs"

[tasks.build]
description = "Build the application binary"
depends = ["fix"]
run = "go build ./cmd/wework"
